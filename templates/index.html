<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 CineBook · book movie tickets</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="booking-app">
    <!-- header -->
    <div class="header">
      <div class="logo">
        <span class="logo-icon">🎬</span>
        <h1>CineBook</h1>
      </div>
      <div class="user-badge">
        <span>🍿</span>
        <p>Guest User</p>
      </div>
    </div>

    <!-- movie selection -->
    <div class="movies-section">
      <div class="section-title">
        <span>🎥</span> Now Showing
      </div>
      <div class="movie-grid" id="movieGrid">
        {% for movie in movies %}
        <div class="movie-card" data-movie-id="{{ movie.id }}">
          <div class="movie-poster">{{ movie.emoji }}</div>
          <div class="movie-title">{{ movie.title }}</div>
          <div class="movie-meta">
            <span>⭐ {{ movie.rating }}</span>
            <span>•</span>
            <span>{{ movie.duration }}</span>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>

    <!-- date & time -->
    <div class="showtime-section">
      <div class="date-picker">
        <label>📅 Date</label>
        <input type="date" id="datePicker">
      </div>
      <div class="time-picker">
        <label>⏰ Showtime</label>
        <select id="timePicker">
          <option value="10:30">10:30 AM</option>
          <option value="13:45">1:45 PM</option>
          <option value="16:20" selected>4:20 PM</option>
          <option value="19:00">7:00 PM</option>
          <option value="22:15">10:15 PM</option>
        </select>
      </div>
    </div>

    <!-- seat selection -->
    <div class="seat-section">
      <div class="screen-visual">
        <div class="screen-curve"></div>
        <div class="screen-label">SCREEN</div>
      </div>

      <div class="seats-grid" id="seatsGrid">
        <!-- Seats will be generated by JavaScript -->
      </div>

      <div class="seat-legend">
        <div class="legend-item"><span class="legend-box"></span> Available</div>
        <div class="legend-item"><span class="legend-box selected"></span> Selected</div>
        <div class="legend-item"><span class="legend-box occupied"></span> Taken</div>
      </div>
    </div>

    <!-- booking summary + checkout -->
    <div class="booking-summary">
      <div class="summary-details">
        <div class="summary-item">
          <span class="summary-label">Movie</span>
          <span class="summary-value" id="selectedMovieName">—</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Seats</span>
          <span class="summary-value" id="selectedSeatsList">—</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Total</span>
          <span class="price-highlight" id="totalPrice">$0</span>
        </div>
      </div>
      <button class="book-btn" id="bookBtn" disabled>
        <span>🎟️</span> Book Tickets
      </button>
    </div>

    <!-- toast/status -->
    <div class="toast-message" id="toastMessage">
      <span>💡</span> Select a movie, date, time, and seats to book.
    </div>
  </div>

  <script>
    (function() {
      // ---------- DATA FROM SERVER ----------
      const movies = {{ movies | tojson }};
      const occupiedSeats = new Set({{ occupied_seats | tojson }});

      // ---------- CONFIGURATION ----------
      const rows = ['A', 'B', 'C', 'D', 'E', 'F'];
      const seatsPerRow = 8;
      const basePrice = 12.50;
      const premiumPrice = 15.00;

      // ---------- STATE ----------
      let selectedMovieId = null;
      let selectedSeats = new Set();

      // ---------- DOM ELEMENTS ----------
      const movieGrid = document.getElementById('movieGrid');
      const seatsGrid = document.getElementById('seatsGrid');
      const selectedMovieNameEl = document.getElementById('selectedMovieName');
      const selectedSeatsListEl = document.getElementById('selectedSeatsList');
      const totalPriceEl = document.getElementById('totalPrice');
      const bookBtn = document.getElementById('bookBtn');
      const toastMessage = document.getElementById('toastMessage');
      const datePicker = document.getElementById('datePicker');
      const timePicker = document.getElementById('timePicker');

      // ---------- UTILS ----------
      function showToast(message, emoji = '💡', borderColor = '#fbbf24') {
        toastMessage.innerHTML = `<span>${emoji}</span> ${message}`;
        toastMessage.style.borderLeftColor = borderColor;
      }

      function updateSummary() {
        const selectedMovie = movies.find(m => m.id === selectedMovieId);
        selectedMovieNameEl.textContent = selectedMovie ? selectedMovie.title : '—';

        if (selectedSeats.size === 0) {
          selectedSeatsListEl.textContent = '—';
        } else {
          const sorted = Array.from(selectedSeats).sort();
          selectedSeatsListEl.textContent = sorted.join(', ');
        }

        let total = 0;
        if (selectedMovie) {
          for (let seat of selectedSeats) {
            const row = seat.charAt(0);
            const price = (row === 'A' || row === 'B') ? premiumPrice : basePrice;
            total += price;
          }
        }
        totalPriceEl.textContent = `$${total.toFixed(2)}`;

        const canBook = selectedMovieId && selectedSeats.size > 0;
        bookBtn.disabled = !canBook;
      }

      // render movie cards
      function renderMovies() {
        // The movies are already rendered by Jinja, but we need to attach event listeners
        // and set the selected state.
        const movieCards = document.querySelectorAll('.movie-card');
        movieCards.forEach(card => {
          const movieId = card.dataset.movieId;
          // Set selected class if it matches current selection
          if (selectedMovieId === movieId) {
            card.classList.add('selected');
          } else {
            card.classList.remove('selected');
          }
          // Remove old listener if any (by cloning, but simpler to just add once)
          // We'll use a named function or just re-add. Since this is called rarely, we can clone.
          // For simplicity, we'll use onclick property.
          card.onclick = () => {
            if (selectedMovieId === movieId) return;
            selectedMovieId = movieId;
            // Re-render movies to update selected class
            renderMovies();
            updateSummary();
            const movie = movies.find(m => m.id === movieId);
            showToast(`Selected "${movie.title}"`, '🎬', '#fbbf24');
          };
        });
      }

      // render seats
      function renderSeats() {
        seatsGrid.innerHTML = '';
        rows.forEach(row => {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'seat-row';
          for (let i = 1; i <= seatsPerRow; i++) {
            const seatLabel = `${row}${i}`;
            const seatDiv = document.createElement('div');
            seatDiv.className = 'seat';
            seatDiv.dataset.seat = seatLabel;
            seatDiv.textContent = seatLabel;

            if (occupiedSeats.has(seatLabel)) {
              seatDiv.classList.add('occupied');
            } else {
              seatDiv.classList.add('available');
              if (selectedSeats.has(seatLabel)) {
                seatDiv.classList.add('selected');
              }
              seatDiv.addEventListener('click', (e) => {
                e.stopPropagation();
                if (seatDiv.classList.contains('occupied')) return;
                if (selectedSeats.has(seatLabel)) {
                  selectedSeats.delete(seatLabel);
                  seatDiv.classList.remove('selected');
                } else {
                  selectedSeats.add(seatLabel);
                  seatDiv.classList.add('selected');
                }
                updateSummary();
              });
            }
            rowDiv.appendChild(seatDiv);
          }
          seatsGrid.appendChild(rowDiv);
        });
      }

      // ---------- INITIAL RENDER ----------
      // Set default date to tomorrow
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const yyyy = tomorrow.getFullYear();
      const mm = String(tomorrow.getMonth() + 1).padStart(2, '0');
      const dd = String(tomorrow.getDate()).padStart(2, '0');
      datePicker.value = `${yyyy}-${mm}-${dd}`;

      renderSeats();
      renderMovies();
      updateSummary();

      // Pre-select the first movie for convenience
      if (movies.length > 0) {
        selectedMovieId = movies[0].id;
        renderMovies();
        updateSummary();
      }

      // ---------- BOOKING ACTION ----------
      bookBtn.addEventListener('click', async () => {
        if (!selectedMovieId || selectedSeats.size === 0) return;

        const movie = movies.find(m => m.id === selectedMovieId);
        const date = datePicker.value;
        const time = timePicker.options[timePicker.selectedIndex].text;
        const seatsArray = Array.from(selectedSeats).sort();

        // Disable button to prevent double click
        bookBtn.disabled = true;
        showToast('Processing your booking...', '⏳', '#94a3b8');

        try {
          const response = await fetch('/api/book', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              movie_id: selectedMovieId,
              seats: seatsArray,
              date: date,
              time: time
            })
          });

          const result = await response.json();

          if (result.success) {
            showToast(`✅ ${result.message} (Ref: ${result.booking_ref})`, '🎟️', '#4ade80');
            // Mark seats as occupied in our local set and re-render
            seatsArray.forEach(seat => occupiedSeats.add(seat));
            selectedSeats.clear();
            renderSeats();
            updateSummary();
            // Show a follow-up message
            setTimeout(() => {
              showToast('Enjoy your movie! 🍿', '🎉', '#fbbf24');
            }, 1200);
          } else {
            showToast(`❌ ${result.message}`, '⚠️', '#ef4444');
            // Re-enable button if booking failed
            updateSummary();
          }
        } catch (error) {
          showToast('❌ Network error. Please try again.', '⚠️', '#ef4444');
          updateSummary();
        }
      });

      // Update toast on date/time change
      datePicker.addEventListener('change', () => {
        showToast(`Date changed to ${datePicker.value}`, '📅', '#94a3b8');
      });
      timePicker.addEventListener('change', () => {
        const selectedTime = timePicker.options[timePicker.selectedIndex].text;
        showToast(`Showtime set to ${selectedTime}`, '⏰', '#94a3b8');
      });

    })();
  </script>
</body>
</html>
